name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcode-select -p

      # Package.swift points the test target at the Command Line Tools for the
      # Swift Testing runtime, because that is what this project is developed
      # against. Those extra rpaths and the plugin path are harmless on a runner
      # with full Xcode — dyld skips search paths that do not exist, and Xcode
      # supplies its own copies of both.
      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./build.sh release

      - name: Check the bundle came out intact
        run: |
          test -x Conduit.app/Contents/MacOS/Conduit
          test -f Conduit.app/Contents/Resources/Conduit.icns
          plutil -lint Conduit.app/Contents/Info.plist
          codesign --verify --strict Conduit.app

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-app
          path: Conduit.app
